<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratic Factoring Practice</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-animation"></div>
    
    <header>
        <h1>🌿 The Quadratic Garden 🌿</h1>
        <p class="subtitle">Practice Factoring Quadratic Expressions</p>
        <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">
            <span class="theme-icon">🌙</span>
        </button>
    </header>

    <main>
        <div class="settings-panel">
            <h2>Settings</h2>
            <div class="setting-group">
                <label class="setting-label">
                    Difficulty:
                    <select id="difficulty">
                        <option value="easy">Easy (leading coefficient = 1)</option>
                        <option value="hard">Hard (leading coefficient ≠ 1)</option>
                    </select>
                </label>
            </div>
            <div class="setting-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="common-factors">
                    <span>Include common factors</span>
                </label>
            </div>
            <button id="new-problem" class="btn-primary">Generate New Problem</button>
        </div>

        <div class="problem-area">
            <div class="problem-display">
                <h3>Factor this expression:</h3>
                <div id="expression" class="expression"></div>
            </div>

            <div class="answer-section">
                <label for="answer-input">Your answer:</label>
                <input type="text" id="answer-input" placeholder="Enter factored form (e.g., (x+2)(x-3) or 2(x+1)(x-1))">
                <div class="button-group">
                    <button id="check-answer" class="btn-check">Check Answer</button>
                    <button id="show-hint" class="btn-hint">Show Hint</button>
                </div>
            </div>

            <div id="feedback" class="feedback"></div>
            <div id="hint" class="hint"></div>
        </div>

        <div class="stats-panel">
            <h3>Your Progress</h3>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">Correct:</span>
                    <span id="correct-count" class="stat-value success">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Attempted:</span>
                    <span id="attempt-count" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Accuracy:</span>
                    <span id="accuracy" class="stat-value">0%</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Streak:</span>
                    <span id="streak" class="stat-value streak">0</span>
                </div>
            </div>
            <button id="reset-stats" class="btn-secondary">Reset Stats</button>
        </div>
    </main>

    <div class="leaves">
        <div class="leaf leaf1">🍃</div>
        <div class="leaf leaf2">🌿</div>
        <div class="leaf leaf3">🍀</div>
        <div class="leaf leaf4">🌱</div>
    </div>

    <footer>
        <div class="footer-content">
            <p>Built for math students everywhere</p>
            <div class="footer-links">
                <a href="https://github.com/JD-Jones-ASES/factoring" target="_blank" rel="noopener noreferrer">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">

                    </svg>
                    View on GitHub
                </a>

                    Support via PayPal

            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
